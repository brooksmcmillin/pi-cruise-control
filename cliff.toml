# git-cliff configuration — Conventional Commits, grouped changelog.
# Preview locally: `git cliff --unreleased --strip header --tag <version>`
# CI runs `--latest --strip header` on tag push and feeds the output to the GitHub Release.

[changelog]
header = ""
# Groups carry a numeric HTML-comment prefix purely to control ordering: `group_by`
# sorts lexically, so the prefix puts Features above Documentation instead of the
# other way round. `striptags` removes it again before rendering.
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})
{%- endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false

commit_parsers = [
  { message = "^feat", group = "<!-- 00 -->Features" },
  { message = "^fix", group = "<!-- 01 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 02 -->Performance" },
  { message = "^refactor", group = "<!-- 03 -->Refactor" },
  { message = "^docs", group = "<!-- 04 -->Documentation" },
  { message = "^test", group = "<!-- 05 -->Tests" },
  { message = "^chore", group = "<!-- 06 -->Miscellaneous" },
  { message = "^ci", group = "<!-- 06 -->Miscellaneous" },
  { message = "^build", group = "<!-- 06 -->Miscellaneous" },
]
filter_commits = true
tag_pattern = "[0-9].*"
